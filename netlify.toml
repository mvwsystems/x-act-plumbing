# netlify.toml — X-Act Plumbing

[build]
  publish = "."

# Canonical host: force www -> apex so every canonical is self-referencing.
[[redirects]]
  from = "https://www.x-actplumbing.com/*"
  to = "https://x-actplumbing.com/:splat"
  status = 301
  force = true

# Redirect clean URLs (optional, enables /about instead of /about.html)
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

